events {
    worker_connections 1024;
}

http {
    upstream nextcrm_app {
        server app-production:3000;
        keepalive 32;
    }

    # Rate limit zones
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/s;
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;

    # Security headers applied to all responses
    map $sent_http_content_type $x_frame_options {
        default "SAMEORIGIN";
    }

    server {
        listen 80;
        server_name _;

        # --- Security headers ---
        add_header X-Frame-Options        "SAMEORIGIN"                         always;
        add_header X-Content-Type-Options "nosniff"                            always;
        add_header X-XSS-Protection       "1; mode=block"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"    always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

        # Allow large file uploads (documents, invoice PDFs)
        client_max_body_size 100M;

        # Shared proxy headers — defined once, applied per location
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass                 $http_upgrade;

        # --- Auth routes — strict rate limit ---
        location ~ ^/api/auth {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://nextcrm_app;
        }

        # --- API routes ---
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;
            proxy_pass         http://nextcrm_app;
            proxy_read_timeout 120s;
        }

        # --- Inngest webhook endpoint (no rate limit — Inngest signs requests) ---
        location /api/inngest {
            proxy_pass         http://nextcrm_app;
            proxy_read_timeout 300s;
        }

        # --- Static assets — immutable cache ---
        location /_next/static/ {
            proxy_pass  http://nextcrm_app;
            add_header  Cache-Control "public, max-age=31536000, immutable";
            access_log  off;
        }

        # --- Next.js image optimization ---
        location /_next/image {
            proxy_pass         http://nextcrm_app;
            proxy_read_timeout 30s;
        }

        # --- Health check endpoint (no logging) ---
        location /api/health {
            proxy_pass  http://nextcrm_app;
            access_log  off;
        }

        # --- Everything else ---
        location / {
            limit_req zone=global burst=200 nodelay;
            limit_req_status 429;
            proxy_pass http://nextcrm_app;
        }
    }

    # --- HTTPS server (uncomment and configure TLS certs to enable) ---
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # ... same location blocks as the HTTP server above ...
    # }
    #
    # Redirect HTTP to HTTPS (enable after TLS is configured):
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }
}
